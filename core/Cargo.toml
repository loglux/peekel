# The directory is `core`, the package `peekel-core`: cargo refuses the name `core` (Rust's own crate).
[package]
name = "peekel-core"
description = "Decode, orient, scale, quantize and encode pictures as Sixel"
version.workspace = true
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp", "tiff", "ico"] }
# DDS in Rust (MIT; BC1-BC7 by bcdec_rs, safe Rust); decoding only: the encoder feature brings a C library
image_dds = { version = "0.7.2", default-features = false, features = ["ddsfile", "image"] }
# JPEG XL in Rust (MIT or Apache 2.0); no rayon (the program makes its own threads), its colour management by moxcms, which is here already
jxl-oxide = { version = "0.12.6", default-features = false, features = ["moxcms"] }
# already in the tree (png and usvg use it): gzipped SVGs are unpacked here, with a limit, not by usvg without one
flate2 = "1.1"
peekel-djvu = { path = "../djvu" }
moxcms = "0.8.1"
hayro = "0.8.0"
# already in the tree (hayro uses it): the names, weight and letters of a font file
skrifa = "0.46.2"
roxmltree = "0.21.2"
resvg = { version = "0.49.0", default-features = false, features = ["text", "system-fonts", "memmap-fonts", "raster-images"] }

[lints]
workspace = true
