[workspace]
members = ["core", "far"]
resolver = "3"

[workspace.package]
version = "0.1.0"
authors = ["Vladislav Sorokin"]
edition = "2024"
rust-version = "1.99"
license = "MIT OR Apache-2.0"
publish = false

# One set of lints for every crate (each opts in with `[lints] workspace = true`); clippy runs with warnings as errors, so
# these are rules, not hints. `unsafe_code` is denied here; the code that talks to the system (the console, Far's C API in the
# plugin, a cdylib) allows it in its own modules with a comment. `core` forbids it outright in its lib.rs.
[workspace.lints.rust]
unsafe_code = "deny"
missing_debug_implementations = "warn"
unused_must_use = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
dbg_macro = "warn"
todo = "warn"
unwrap_used = "warn"
expect_used = "warn"
print_stdout = "warn"
print_stderr = "warn"

[profile.release]
lto = true
codegen-units = 1
# no panic = "abort": a panic must unwind so that the terminal's mode and screen are put back (Drop does it)
strip = true
