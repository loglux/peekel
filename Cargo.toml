[workspace]
members = ["core", "term", "far", "djvu"]
# copies of other projects' crates, changed for Peekel (vendor/README.md): not members, so our lints do not judge their code
exclude = ["vendor"]
resolver = "3"

[workspace.package]
version = "0.10.1"
authors = ["Vladislav Sorokin"]
edition = "2024"
rust-version = "1.99"
license = "MIT OR Apache-2.0"
publish = false

# One set of lints for every crate (each opts in with `[lints] workspace = true`); clippy runs with warnings as errors, so
# these are rules, not hints. `unsafe_code` is denied here; the code that talks to the system (the console, Far's C API in the
# plugin, a cdylib) allows it in its own modules with a comment. `core` forbids it outright in its lib.rs.
[workspace.lints.rust]
unsafe_code = "deny"
missing_debug_implementations = "warn"
unused_must_use = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
dbg_macro = "warn"
todo = "warn"
unwrap_used = "warn"
expect_used = "warn"
print_stdout = "warn"
print_stderr = "warn"

[profile.release]
lto = true
codegen-units = 1
# no panic = "abort": a panic must unwind so that the terminal's mode and screen are put back (Drop does it)
strip = true

# hayro-syntax with the JPEG of a page decoded at a reduced size, over zune-jpeg's unreleased reduced IDCT; hayro with a picture
# shrunk by an area average of our own on 32-bit ARM (vendor/README.md)
[patch.crates-io]
hayro = { path = "vendor/hayro" }
hayro-syntax = { path = "vendor/hayro-syntax" }
