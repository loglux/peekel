[package]
name = "peekel-far"
description = "Far Manager plugin: a picture in the quick view panel as Sixel (an experiment, see docs/far-plugin.md)"
version.workspace = true
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lib]
name = "peekel_far"
crate-type = ["cdylib"]

[dependencies]
peekel-core = { path = "../core" }
# the picture type core's decoders give (no codecs of its own are wanted here)
image = { version = "0.25.10", default-features = false }

# Windows' own codecs (WIC): HEIC, AVIF, JPEG XL and whatever else is installed on the machine (docs/internal/formats.md)
[target.'cfg(windows)'.dependencies.windows]
version = "0.62"
features = ["Win32_Foundation", "Win32_Graphics_Imaging", "Win32_System_Com"]

[lints]
workspace = true
